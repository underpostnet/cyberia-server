
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: server.cyberiaonline.com
  namespace: underpost-workloads
  labels:
    app.kubernetes.io/managed-by: underpost
    deploy-id: dd-cyberia-production
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: dd-cyberia-production
      namespace: underpost-workloads
  hostnames:
    - server.cyberiaonline.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /404
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /server.cyberiaonline.com/root/status-pages/404
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Alt-Svc
                value: 'h3=":443"; ma=86400'
      backendRefs:
        - name: underpost-gateway-service
          namespace: underpost-platform
          port: 80
          weight: 100
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Alt-Svc
                value: 'h3=":443"; ma=86400'
      backendRefs:
        - name: underpost-gateway-service
          namespace: underpost-platform
          port: 80
          weight: 100
