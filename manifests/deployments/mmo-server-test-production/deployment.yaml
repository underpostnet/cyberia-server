---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dd-cyberia-mmo-server-test-production-blue
  namespace: default
  labels:
    app: dd-cyberia-mmo-server-test-production-blue
    deploy-id: dd-cyberia-mmo-server-test-production
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dd-cyberia-mmo-server-test-production-blue
  template:
    metadata:
      labels:
        app: dd-cyberia-mmo-server-test-production-blue
        deploy-id: dd-cyberia-mmo-server-test-production
    spec:
      containers:
        - name: dd-cyberia-mmo-server-test-production-blue
          image: underpost/cyberia-server:v3.3.76
          imagePullPolicy: Always
          envFrom:
            - secretRef:
                name: underpost-config
            # The deployment's own environment, with its .env.<env>.oci overlay already
            # applied by 'app apply'. Optional so a deployment predating that Secret still
            # starts; the in-pod 'app load' resolves the same overlay as a second path.
            - secretRef:
                name: dd-cyberia-mmo-server-test-production-env
                optional: true
          ports:
            - containerPort: 8081

          command:
            - /bin/sh
            - -c
            - >
              set -a && . /home/dd/engine/engine-private/conf/dd-cyberia/instances/mmo-server-test/env/production.env && set +a && exec /home/dd/engine/cyberia-server/server --data-server-url=$CYBERIA_DATA_SERVER_URL --data-server-grpc=dd-cyberia-grpc-service-production-blue.default.svc.cluster.local:50051
          readinessProbe:
            {
              "tcpSocket": {
                "port": 8081
              },
              "initialDelaySeconds": 3,
              "periodSeconds": 5,
              "timeoutSeconds": 3,
              "failureThreshold": 6
            }
          livenessProbe:
            {
              "tcpSocket": {
                "port": 8081
              },
              "initialDelaySeconds": 30,
              "periodSeconds": 20,
              "timeoutSeconds": 5,
              "failureThreshold": 3
            }
          lifecycle:
            {
              "postStart": {
                "exec": {
                  "command": [
                    "sh",
                    "-c",
                    "underpost state set container-status dd-cyberia-mmo-server-test-production-initializing-deployment || true"
                  ]
                }
              },
              "preStop": {
                "exec": {
                  "command": [
                    "sh",
                    "-c",
                    "underpost state set container-status dd-cyberia-mmo-server-test-production-stopping-deployment || true"
                  ]
                }
              }
            }


    
          volumeMounts:
            - name: instance-cyberia-server-dd-cyberia-mmo-server-test-pro-e667161f
              mountPath: /home/dd/engine/engine-private/conf/dd-cyberia/instances/mmo-server-test/env
    
      volumes:
        - name: instance-cyberia-server-dd-cyberia-mmo-server-test-pro-e667161f
          persistentVolumeClaim:
            claimName: instance-cyberia-server-dd-cyberia-mmo-server-test-production-blue
    
      
---
apiVersion: v1
kind: Service
metadata:
  name: dd-cyberia-mmo-server-test-production-blue-service
  namespace: default
spec:
  selector:
    app: dd-cyberia-mmo-server-test-production-blue
  ports:
    - name: 'tcp-8081'
      protocol: TCP
      port: 8081
      targetPort: 8081
    - name: 'udp-8081'
      protocol: UDP
      port: 8081
      targetPort: 8081
  type: LoadBalancer